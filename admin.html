<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
</head>
<body>

<h2>Add Article</h2>

<input id="title" placeholder="Title"><br><br>
<input id="category" placeholder="Category"><br><br>
<input id="image" placeholder="Image URL"><br><br>
<textarea id="content" placeholder="Content"></textarea><br><br>

<button onclick="save()">Save</button>

<script>
function save(){
  let data = JSON.parse(localStorage.getItem("wiki") || "[]");

  data.push({
    title: title.value,
    category: category.value,
    image: image.value,
    content: content.value
  });

  localStorage.setItem("wiki", JSON.stringify(data));
  alert("Saved (local only)");
}
</script>

</body>
</html>
