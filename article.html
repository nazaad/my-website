<!DOCTYPE html>
<html>
<head>
  <title>Article</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<a href="index.html">⬅ Back</a>

<div id="article"></div>

<script>
let id = new URLSearchParams(window.location.search).get("id");

fetch("articles.json")
.then(res => res.json())
.then(data => {
  let a = data[id];

  document.getElementById("article").innerHTML = `
    <h1>${a.title}</h1>
    <img src="${a.image}" />
    <h3>Category: ${a.category}</h3>
    <p>${a.content}</p>
  `;
});
</script>

</body>
</html>
