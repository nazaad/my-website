<!DOCTYPE html>
<html>
<head>
  <title>Article</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<a href="index.html">⬅ Back</a>

<div id="article"></div>

<script>
let slug = new URLSearchParams(window.location.search).get("id");

fetch("articles.json")
  .then(res => res.json())
  .then(data => {
    let article = data[slug];

    if(!article){
      document.getElementById("article").innerHTML = "<h2>Article not found</h2>";
      return;
    }

    document.getElementById("article").innerHTML = `
      <h1>${article.title}</h1>
      <p>${article.content}</p>
    `;
  });
</script>

</body>
</html>
