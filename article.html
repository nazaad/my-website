<!DOCTYPE html>
<html>
<head>
  <title>Article</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="article"></div>

<script>
const id = new URLSearchParams(window.location.search).get("id");

fetch("articles.json")
.then(res => res.json())
.then(data => {
  const item = data[id];

  document.getElementById("article").innerHTML = `
    <h1>${item.title}</h1>
    <p>${item.content}</p>
    <a href="index.html">⬅ Back</a>
  `;
});
</script>

</body>
</html>
